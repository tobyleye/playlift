# .github/workflows/deploy.yml
name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deploy to EC2 (copy source code)
      - name: Copy source to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/opt/playlift/"
          rm: true
          exclude: "node_modules,web/node_modules,web/dist,.git,.github"

      # SSH and build on server
      - name: Build and restart on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/playlift
            go build -o playlift .
            cd web
            npm ci
            npm run build
            cd ..
            sudo systemctl restart playlift